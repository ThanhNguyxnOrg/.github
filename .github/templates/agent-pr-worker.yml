# Managed by ThanhNguyxnAgent Auto-Onboarding. Do not edit this file manually.
name: ThanhNguyxnAgent PR Event Worker

on:
  workflow_run:
    workflows:
      - ThanhNguyxnAgent PR Event Signal
    types: [completed]

# The privileged worker only receives a read-only GITHUB_TOKEN.
# The central reusable workflow mints a narrowly scoped GitHub App token.
permissions:
  contents: read

concurrency:
  group: agent-pr-${{ github.event.workflow_run.repository.name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  process:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      github.event.workflow_run.repository.owner.login == 'ThanhNguyxnOrg'
    uses: ThanhNguyxnOrg/.github/.github/workflows/agent-pr-worker.yml@main
    with:
      repository_owner: ${{ github.event.workflow_run.repository.owner.login }}
      repository_name: ${{ github.event.workflow_run.repository.name }}
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets: inherit
