name: Shared CI — Go

on:
  workflow_call:
    inputs:
      job_name:
        required: false
        default: Verify (Go)
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
      go_version:
        required: false
        default: stable
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      test_command:
        required: false
        default: go test ./...
        type: string
      vet_command:
        required: false
        default: go vet ./...
        type: string
      lint_install_command:
        required: false
        default: ""
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      build_command:
        required: false
        default: ""
        type: string
      artifact_name:
        required: false
        default: ""
        type: string
      artifact_path:
        required: false
        default: ""
        type: string
      artifact_retention_days:
        required: false
        default: 5
        type: number

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
      - name: Install lint tooling
        if: inputs.lint_install_command != ''
        env:
          COMMAND: ${{ inputs.lint_install_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Lint
        if: inputs.lint_command != ''
        env:
          COMMAND: ${{ inputs.lint_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: inputs.test_command != ''
        env:
          COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Vet
        if: inputs.vet_command != ''
        env:
          COMMAND: ${{ inputs.vet_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: inputs.build_command != ''
        env:
          COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload CI artifact
        if: inputs.artifact_name != '' && inputs.artifact_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
