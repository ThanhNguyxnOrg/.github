name: ThanhNguyxnAgent — Risk-Based PR Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/agent-controller.mjs'
      - '.github/scripts/agent-controller.test.mjs'
      - '.github/scripts/agent-onboard.mjs'
      - '.github/scripts/agent-onboard.test.mjs'
      - '.github/templates/agent-pr-signal.yml'
      - '.github/templates/agent-pr-worker.yml'
      - '.github/workflows/agent-pr-worker.yml'
      - '.github/scripts/check-policy.mjs'
      - '.github/scripts/check-policy.test.mjs'
      - '.github/scripts/stale-controller.mjs'
      - '.github/scripts/stale-controller.test.mjs'
      - 'ci-policy.json'
      - '.github/workflows/stale.yml'
      - 'agent-policy.json'
      - '.github/workflows/agent-controller.yml'
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thanhnguyxnagent-org-controller
  cancel-in-progress: false

jobs:
  reconcile:
    name: Triage issues, auto-merge safe dependencies, and route risky PRs to humans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout central policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create organization-wide ThanhNguyxnAgent token
        id: agent
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@4546359b3efa22e883cb808c85f3b77859690f52
        with:
          profile: remediation
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create organization-wide workflow-onboarding token
        id: onboarding
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write

      - name: Test central policy helpers
        run: node --test .github/scripts/agent-controller.test.mjs .github/scripts/agent-onboard.test.mjs .github/scripts/check-policy.test.mjs .github/scripts/stale-controller.test.mjs

      - name: Auto-onboard active organization repositories
        env:
          GH_TOKEN: ${{ steps.onboarding.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: node .github/scripts/agent-onboard.mjs

      - name: Reconcile open pull requests and issues
        env:
          GH_TOKEN: ${{ steps.agent.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: node .github/scripts/agent-controller.mjs
