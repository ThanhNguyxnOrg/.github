name: ThanhNguyxnAgent — Process one PR

on:
  workflow_call:
    inputs:
      repository_owner:
        description: Organization that owns the PR repository.
        required: true
        type: string
      repository_name:
        description: Repository name containing the PR.
        required: true
        type: string
      workflow_run_id:
        description: Completed metadata-signal workflow run ID.
        required: true
        type: number
      policy_ref:
        description: Optional immutable central commit used by the trusted policy checkout. When empty, the workflow resolves the agent-v1 tag to its commit instead (see the Resolve step). Kept as an emergency per-repository override; callers should normally omit it.
        required: false
        type: string
    secrets:
      BOT_PRIVATE_KEY:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  process:
    if: inputs.repository_owner == 'ThanhNguyxnOrg' && inputs.workflow_run_id > 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve trusted policy revision
        id: policy
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ inputs.repository_owner }}
        run: |
          set -euo pipefail
          # Caller-supplied SHA pin (legacy / emergency override): keep the
          # old strict validation and use it verbatim.
          if [[ -n "${POLICY_REF}" ]]; then
            if [[ ! "${POLICY_REF}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::policy_ref must be a full 40-character commit SHA" >&2
              exit 1
            fi
            echo "resolved_sha=${POLICY_REF}" >> "${GITHUB_OUTPUT}"
            echo "[policy] using caller-supplied policy pin ${POLICY_REF}"
            exit 0
          fi
          # No pin supplied: resolve the agent-v1 moving tag to its commit.
          # The commits API dereferences annotated tags, so this is the
          # commit SHA even when agent-v1 is an annotated tag.
          resolved="$(gh api "repos/${REPOSITORY_OWNER}/.github/commits/agent-v1" --jq '.sha')"
          if [[ ! "${resolved}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::agent-v1 did not resolve to a full commit SHA" >&2
            exit 1
          fi
          # The resolved commit must be on main. Compare API direction
          # matters: base=resolved, head=main, so 'ahead' means main is
          # ahead of the resolved commit (i.e. it is an ancestor of main)
          # and 'identical' means it is main HEAD. Anything else
          # (behind/diverged) or a 404 means the tag points somewhere
          # untrusted; fail closed. This also avoids a shallow-clone
          # git merge-base check (checkout uses fetch-depth 1).
          status="$(gh api "repos/${REPOSITORY_OWNER}/.github/compare/${resolved}...main" --jq '.status')"
          if [[ "${status}" != "identical" && "${status}" != "ahead" ]]; then
            echo "::error::agent-v1 resolved to ${resolved}, which is not on main (compare status: ${status})" >&2
            exit 1
          fi
          echo "resolved_sha=${resolved}" >> "${GITHUB_OUTPUT}"
          echo "[policy] Resolved agent-v1 -> ${resolved} (compare status: ${status})"

      - name: Create read-only token for central Agent policy
        id: central
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ inputs.repository_owner }}
          repositories: .github
          permission-contents: read

      - name: Checkout trusted central Agent policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ThanhNguyxnOrg/.github
          ref: ${{ steps.policy.outputs.resolved_sha }}
          token: ${{ steps.central.outputs.token }}
          persist-credentials: false

      - name: Download the event metadata artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-pr-event-${{ inputs.workflow_run_id }}
          path: agent-event
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          run-id: ${{ inputs.workflow_run_id }}
          github-token: ${{ github.token }}

      - name: Validate the event metadata
        id: event
        env:
          EXPECTED_REPOSITORY: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync('agent-event/agent-pr-event.json', 'utf8'));
          const expectedRepository = String(process.env.EXPECTED_REPOSITORY || '').toLowerCase();
          const repository = String(payload.repository || '').toLowerCase();
          const prNumber = Number(payload.pr_number);
          const headSha = String(payload.head_sha || '').toLowerCase();
          const headRepository = String(payload.head_repository || '');
          const sourceEvent = String(payload.source_event || '');

          if (!['pull_request', 'pull_request_target'].includes(sourceEvent)) {
            throw new Error('Event artifact is not from a pull_request or pull_request_target event');
          }
          if (!expectedRepository || repository !== expectedRepository) {
            throw new Error('Event artifact repository does not match the workflow_run repository');
          }
          if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
            throw new Error('Event artifact contains an invalid pull request number');
          }
          if (!/^[0-9a-f]{40}$/.test(headSha)) {
            throw new Error('Event artifact contains an invalid pull request head SHA');
          }
          if (headRepository && !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(headRepository)) {
            throw new Error('Event artifact contains an invalid head repository');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            'pr_number=' + prNumber,
            'head_sha=' + headSha,
            'head_repository=' + headRepository
          ].join('\n') + '\n');
          NODE

      - name: Create repository-scoped Agent token
        id: agent
        uses: ./.github/actions/agent-token
        with:
          profile: remediation
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ inputs.repository_owner }}
          repositories: ${{ inputs.repository_name }}

      - name: Process the event PR using central policy
        env:
          GH_TOKEN: ${{ steps.agent.outputs.token }}
          ORG: ${{ inputs.repository_owner }}
          EVENT_REPOSITORY: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          EVENT_PR_NUMBER: ${{ steps.event.outputs.pr_number }}
          EVENT_PR_HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          EVENT_PR_HEAD_REPOSITORY: ${{ steps.event.outputs.head_repository }}
        run: node .github/scripts/agent-controller.mjs
