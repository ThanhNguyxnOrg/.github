name: Sync org showcase

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-org-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: "4125740"
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync showcase tables
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/sync-org.py
      - name: Commit on diff
        run: |
          git config user.name "thanhnguyxnagent[bot]"
          git config user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          git add profile/README.md docs/projects.md docs/stack.md
          git diff --cached --quiet || git commit -m "chore: sync org showcase tables [skip ci]"
      - name: Push
        run: git push
