name: Sync org showcase

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-org-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync showcase tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync-org.py
      - name: Commit on diff
        run: |
          git config user.name "ThanhNguyxnAgent"
          git config user.email "ThanhNguyxnAgent@users.noreply.github.com"
          git add profile/README.md docs/projects.md docs/stack.md
          git diff --cached --quiet || git commit -m "chore: sync org showcase tables [skip ci]"
      - name: Push
        run: git push
