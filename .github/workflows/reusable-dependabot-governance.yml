name: Reusable Dependabot governance

on:
  workflow_call:
    inputs:
      reviewers:
        description: "Comma-separated human reviewers for updates requiring review"
        required: false
        type: string
        default: "ThanhNguyxn07,RealThanhNguyxn"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-dependabot-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govern:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Create repository-scoped Agent token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Classify update (fail closed)
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          SAFE=false
          REVIEW_LABEL="needs-review"
          REVIEW_REASON="Dependabot metadata is missing or the update type is not explicitly safe."

          if [[ -z "$UPDATE_TYPE" || -z "$ECOSYSTEM" ]]; then
            REVIEW_REASON="Dependency metadata is incomplete; automatic merging is disabled."
          elif [[ "$ECOSYSTEM" == "github_actions" ]]; then
            REVIEW_LABEL="workflow-update"
            REVIEW_REASON="GitHub Actions changes require human review, including patch and minor updates."
          else
            case "$UPDATE_TYPE" in
              version-update:semver-patch|version-update:semver-minor)
                SAFE=true
                REVIEW_REASON="Non-major dependency update; waiting for every reported check to finish successfully."
                ;;
              version-update:semver-major)
                REVIEW_LABEL="major-update"
                REVIEW_REASON="Major dependency updates always require human review."
                ;;
              *)
                REVIEW_REASON="Unrecognized update type '$UPDATE_TYPE'; automatic merging is disabled."
                ;;
            esac
          fi

          echo "auto_merge=$SAFE" >> "$GITHUB_OUTPUT"
          echo "review_label=$REVIEW_LABEL" >> "$GITHUB_OUTPUT"
          echo "review_reason=$REVIEW_REASON" >> "$GITHUB_OUTPUT"
          echo "Agent decision: auto_merge=$SAFE ecosystem=$ECOSYSTEM update_type=$UPDATE_TYPE reason=$REVIEW_REASON"

      - name: Normalize Agent labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create dependencies --color "1D76DB" --description "Dependency update opened by Dependabot." --force
          gh label create agent-auto-merge --color "0E8A16" --description "Eligible patch/minor update; CI passed and Agent queued auto-merge." --force
          gh label create needs-review --color "D93F0B" --description "Human review required; Agent will not merge automatically." --force
          gh label create major-update --color "FBCA04" --description "Major dependency update; human review required." --force
          gh label create workflow-update --color "5319E7" --description "GitHub Actions or workflow dependency update; human review required." --force
          gh label create ci-failed --color "B60205" --description "One or more pull request checks failed." --force
          gh label create ci-pending --color "FBCA04" --description "Pull request checks did not finish within the Agent wait window." --force
          gh label create ci-missing --color "C5DEF5" --description "No successful CI status checks were reported; human review required." --force
          gh pr edit "$PR_URL" --add-label "dependencies"

      - name: Wait for all pull request checks
        id: checks
        if: steps.policy.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          STATE="pending"

          for attempt in $(seq 1 45); do
            if ! CHECK_JSON=$(gh pr view "$PR_URL" --json statusCheckRollup); then
              echo "::warning::Could not read the current check rollup; refusing to merge."
              STATE="missing"
              break
            fi

            STATE=$(jq -r '
              def failed:
                (.conclusion == "FAILURE"
                 or .conclusion == "CANCELLED"
                 or .conclusion == "TIMED_OUT"
                 or .conclusion == "ACTION_REQUIRED"
                 or .conclusion == "STALE"
                 or .conclusion == "STARTUP_FAILURE"
                 or .state == "FAILURE"
                 or .state == "ERROR");
              def passed:
                (.conclusion == "SUCCESS"
                 or .conclusion == "NEUTRAL"
                 or .conclusion == "SKIPPED"
                 or .state == "SUCCESS");
              (.statusCheckRollup // []) as $checks
              | if ($checks | length) == 0 then "missing"
                elif any($checks[]; failed) then "failure"
                elif all($checks[]; passed) then
                  if any($checks[]; (.conclusion == "SUCCESS" or .state == "SUCCESS"))
                  then "success"
                  else "missing"
                  end
                else "pending"
                end
            ' <<< "$CHECK_JSON")

            echo "Check state $attempt/45: $STATE"
            if [[ "$STATE" == "success" || "$STATE" == "failure" ]]; then
              break
            fi

            sleep 20
          done

          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Approve and queue safe update
        id: merge
        if: steps.policy.outputs.auto_merge == 'true' && steps.checks.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve --body "Approved by ThanhNguyxnAgent: patch/minor dependency update and all reported CI checks passed."

          BODY=$(cat <<'EOF'
          Verified and queued for auto-merge by ThanhNguyxnAgent after all reported pull request checks passed.

          Co-authored-by: ThanhNguyxnAgent[bot] <296222857+thanhnguyxnagent[bot]@users.noreply.github.com>
          EOF
          )

          if gh pr merge "$PR_URL" --auto --squash --body "$BODY"; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
            gh pr edit "$PR_URL" --add-label "agent-auto-merge"
          else
            echo "::warning::GitHub did not accept the auto-merge request; the PR will be escalated for human review."
            echo "queued=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assign and request human review
        if: steps.policy.outputs.auto_merge != 'true' || steps.checks.outputs.state != 'success' || steps.merge.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEWERS: ${{ inputs.reviewers }}
          AUTO_MERGE: ${{ steps.policy.outputs.auto_merge }}
          REVIEW_LABEL: ${{ steps.policy.outputs.review_label }}
          REVIEW_REASON: ${{ steps.policy.outputs.review_reason }}
          CHECK_STATE: ${{ steps.checks.outputs.state }}
          MERGE_QUEUED: ${{ steps.merge.outputs.queued }}
        run: |
          LABEL="$REVIEW_LABEL"
          REASON="$REVIEW_REASON"

          if [[ "$AUTO_MERGE" == "true" ]]; then
            case "$CHECK_STATE" in
              failure)
                LABEL="ci-failed"
                REASON="One or more pull request checks failed. ThanhNguyxnAgent will not merge this update."
                ;;
              missing)
                LABEL="ci-missing"
                REASON="No successful CI status rollup was available. ThanhNguyxnAgent will not merge without check evidence."
                ;;
              *)
                LABEL="ci-pending"
                REASON="CI did not reach a fully successful state within 15 minutes. The PR is being escalated instead of merged."
                ;;
            esac
          elif [[ "$MERGE_QUEUED" == "false" ]]; then
            LABEL="needs-review"
            REASON="The update passed the safety policy and CI, but GitHub did not accept the auto-merge request."
          fi

          gh pr edit "$PR_URL"             --add-label "needs-review,$LABEL"             --add-assignee "$REVIEWERS"             --add-reviewer "$REVIEWERS"

          COMMENT_MARKER="<!-- thanhnguyxnagent:review-required -->"
          COMMENT_COUNT=$(gh pr view "$PR_URL" --json comments --jq '[.comments[].body | select(contains("<!-- thanhnguyxnagent:review-required -->"))] | length')

          if [[ "$COMMENT_COUNT" == "0" ]]; then
            gh pr comment "$PR_URL" --body "## ThanhNguyxnAgent — human review required

          $REASON

          Assigned reviewers: $REVIEWERS

          The Agent has left this pull request open and has not merged it.

          $COMMENT_MARKER"
          fi
