name: Organization-wide stale issue and PR controller

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/stale-controller.mjs'
      - '.github/scripts/stale-controller.test.mjs'
      - 'agent-policy.json'
      - '.github/workflows/stale.yml'
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thanhnguyxnagent-stale-controller
  cancel-in-progress: false

jobs:
  reconcile:
    name: Mark and close stale organization issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout central policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create organization-wide Agent token
        id: agent
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-pull-requests: write

      - name: Test stale policy helpers
        run: node --test .github/scripts/stale-controller.test.mjs

      - name: Reconcile stale issues and pull requests
        env:
          GH_TOKEN: ${{ steps.agent.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: node .github/scripts/stale-controller.mjs
