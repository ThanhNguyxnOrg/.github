name: ThanhNguyxnAgent — Sync worker policy pin

# Keeps the managed worker pins (central relay + distributed template) on the
# current main HEAD, so a policy change never waits on a manual "advance pin"
# commit and a pin can never dangle after a squash merge. The pin stays a full
# immutable SHA; only its value tracks main automatically. Pushing the relay
# workflow file needs the App token with contents + workflows write (the same
# pair the onboard job already uses).
#
# Anti-spam (Cách 2, 2026-11-18): the pin only advances on pushes that touch
# policy files (paths filter below), there is no hourly cron, and there is no
# immediate dispatch to the controller. A pin advance is distributed by the
# controller's hourly sweep instead, so N pin advances inside one hour
# collapse into a single onboard commit per repository (max ~1h delay).
# The controller's push trigger no longer lists the worker template either,
# otherwise a pin commit would still fan out immediately via that trigger.

on:
  push:
    branches: [main]
    paths:
      - 'agent-policy.json'
      - 'ci-policy.json'
      - 'release-policy.json'
      - '.github/workflows/agent-pr-worker.yml'
      - '.github/workflows/agent-pr-worker-relay.yml'
      - '.github/templates/agent-pr-worker.yml'
      - '.github/scripts/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thanhnguyxnagent-policy-pin-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Advance worker policy pin to main HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create a policy-pin token
        id: pin-sync
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.pin-sync.outputs.token }}

      - name: Run central policy regression tests
        run: node --test .github/scripts/agent-controller.test.mjs .github/scripts/agent-onboard.test.mjs .github/scripts/check-policy.test.mjs .github/scripts/stale-controller.test.mjs

      - name: Advance worker policy pin to HEAD
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          # A pin commit only moves the pin lines, never policy, so the pin
          # already covers everything at HEAD. Without this guard every pin
          # commit would retrigger this workflow and mint another pin commit.
          if git log -1 --format=%s | grep -q '^chore(agent): advance worker policy pin to '; then
            echo "[pin-sync] HEAD is a pin-sync commit; nothing to do"
            exit 0
          fi
          files=(.github/workflows/agent-pr-worker-relay.yml .github/templates/agent-pr-worker.yml)
          for file in "${files[@]}"; do
            sed -i -E "s#agent-pr-worker\.yml@[0-9a-f]{40}#agent-pr-worker.yml@${head}#g" "$file"
            sed -i -E "s#^([[:space:]]*policy_ref:[[:space:]]*)[0-9a-f]{40}#\1${head}#" "$file"
          done
          if git diff --quiet -- "${files[@]}"; then
            echo "[pin-sync] worker policy pin already at ${head}; nothing to do"
            exit 0
          fi
          git config user.name "thanhnguyxnagent[bot]"
          git config user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore(agent): advance worker policy pin to ${head}"
          git push origin HEAD:main
