name: Renovate — organization dependency updates

on:
  schedule:
    # Daily at 10:17 Asia/Bangkok (03:17 UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-organization
  cancel-in-progress: false

jobs:
  renovate:
    name: Discover and propose dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create organization-scoped ThanhNguyxnAgent token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: read
          permission-checks: write
          permission-commit-statuses: write
          permission-contents: write
          permission-dependabot-alerts: read
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout central automation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Renovate across the organization
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d
        with:
          configurationFile: renovate-global.js
          token: ${{ steps.app-token.outputs.token }}
          env-regex: '^(?:RENOVATE_\\w+|LOG_LEVEL)$'
        env:
          LOG_LEVEL: info
