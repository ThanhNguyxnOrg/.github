name: Reusable auto-assign human-only

on:
  workflow_call:
    inputs:
      assignees:
        description: "Comma-separated logins to assign"
        required: false
        type: string
        default: ThanhNguyxn07,RealThanhNguyxn

jobs:
  auto-assign:
    if: github.event.sender.type != 'Bot' && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create ThanhNguyxnAgent token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Auto-assign issue/PR
        uses: pozil/auto-assign-issue@v4
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          assignees: ${{ inputs.assignees }}
          allowSelfAssign: true
          abortIfPreviousAssignees: true
