name: Release Asset Publisher

on:
  workflow_call:
    inputs:
      tag:
        description: Existing version tag created by the central Release Controller.
        required: true
        type: string
      artifact_pattern:
        description: GitHub Actions artifact name or pattern containing release assets.
        required: false
        default: release-assets-*
        type: string
      artifact_directory:
        description: Directory used to collect downloaded platform artifacts before manifest validation.
        required: false
        default: dist/release
        type: string
      policy_ref:
        description: Ref containing the central release-policy.json.
        required: false
        default: main
        type: string
    secrets:
      BOT_APP_ID:
        description: Organization-wide ThanhNguyxnAgent GitHub App client ID.
        required: true
      BOT_PRIVATE_KEY:
        description: Organization-wide ThanhNguyxnAgent GitHub App private key.
        required: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Validate and upload release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download all platform build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: ${{ inputs.artifact_directory }}
          merge-multiple: false

      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: agent
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Upload assets and verify central manifest
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-release-assets@a7226c062bcc672115d5d06ececbf2911531e8f8
        with:
          token: ${{ steps.agent.outputs.token }}
          tag: ${{ inputs.tag }}
          path: ${{ inputs.artifact_directory }}
          policy-ref: ${{ inputs.policy_ref }}
