name: Shared CI — Python

on:
  workflow_call:
    inputs:
      job_name:
        description: Exact check-run name.
        required: false
        default: Verify (Python)
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
      python_version:
        required: false
        default: "3.12"
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      cache:
        required: false
        default: pip
        type: string
      cache_dependency_path:
        required: false
        default: ""
        type: string
      install_command:
        required: false
        default: python -m pip install -r requirements.txt
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      typecheck_command:
        required: false
        default: ""
        type: string
      test_command:
        required: false
        default: pytest -q
        type: string
      build_command:
        required: false
        default: ""
        type: string
      artifact_name:
        required: false
        default: ""
        type: string
      artifact_path:
        required: false
        default: ""
        type: string
      artifact_retention_days:
        required: false
        default: 5
        type: number

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}
      - name: Install dependencies
        if: inputs.install_command != ''
        env:
          COMMAND: ${{ inputs.install_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Lint
        if: inputs.lint_command != ''
        env:
          COMMAND: ${{ inputs.lint_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Typecheck
        if: inputs.typecheck_command != ''
        env:
          COMMAND: ${{ inputs.typecheck_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: inputs.test_command != ''
        env:
          COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: inputs.build_command != ''
        env:
          COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload CI artifact
        if: inputs.artifact_name != '' && inputs.artifact_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
