name: Shared CI — Python

on:
  workflow_call:
    inputs:
      job_name:
        description: Exact check-run name.
        required: false
        default: Verify (Python)
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        default: 360
        type: number
      fetch_depth:
        description: Git history depth for checkout; use 0 for full history.
        required: false
        default: 1
        type: number
      python_version:
        required: false
        default: "3.12"
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      cache:
        required: false
        default: pip
        type: string
      cache_dependency_path:
        required: false
        default: ""
        type: string
      install_command:
        required: false
        default: python -m pip install -r requirements.txt
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      typecheck_command:
        required: false
        default: ""
        type: string
      test_command:
        required: false
        default: pytest -q
        type: string
      build_command:
        required: false
        default: ""
        type: string
      artifact_name:
        required: false
        default: ""
        type: string
      artifact_path:
        required: false
        default: ""
        type: string
      artifact_retention_days:
        required: false
        default: 5
        type: number

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs.python_version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}
      - name: Install dependencies
        if: inputs.install_command != ''
        env:
          COMMAND: ${{ inputs.install_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Lint
        if: inputs.lint_command != ''
        env:
          COMMAND: ${{ inputs.lint_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Typecheck
        if: inputs.typecheck_command != ''
        env:
          COMMAND: ${{ inputs.typecheck_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: inputs.test_command != ''
        env:
          COMMAND: ${{ inputs.test_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: inputs.build_command != ''
        env:
          COMMAND: ${{ inputs.build_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload CI artifact
        if: inputs.artifact_name != '' && inputs.artifact_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
