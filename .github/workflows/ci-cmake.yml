name: Shared CI — CMake

on:
  workflow_call:
    inputs:
      job_name:
        required: false
        default: Verify (CMake)
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        default: 360
        type: number
      fetch_depth:
        description: Git history depth for checkout; use 0 for full history.
        required: false
        default: 1
        type: number
      working_directory:
        description: Project directory used for configure, build and test commands.
        required: false
        default: "."
        type: string
      dependencies_command:
        required: false
        default: ""
        type: string
      configure_command:
        required: false
        default: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        type: string
      build_command:
        required: false
        default: cmake --build build --config Release --parallel
        type: string
      test_command:
        required: false
        default: ctest --test-dir build --build-config Release --output-on-failure
        type: string
      artifact_name:
        required: false
        default: ""
        type: string
      artifact_path:
        required: false
        default: ""
        type: string
      artifact_retention_days:
        required: false
        default: 5
        type: number

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false
      - name: Install system dependencies
        if: inputs.dependencies_command != ''
        env:
          COMMAND: ${{ inputs.dependencies_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Configure
        env:
          COMMAND: ${{ inputs.configure_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        env:
          COMMAND: ${{ inputs.build_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: inputs.test_command != ''
        env:
          COMMAND: ${{ inputs.test_command }}
        working-directory: ${{ inputs.working_directory }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload CI artifact
        if: inputs.artifact_name != '' && inputs.artifact_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
