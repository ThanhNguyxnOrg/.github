name: Shared Publish — npm

on:
  workflow_call:
    inputs:
      job_name:
        description: Exact check-run name for the publish job.
        required: false
        default: Publish to npm
        type: string
      runner:
        description: GitHub-hosted runner label.
        required: false
        default: ubuntu-latest
        type: string
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        default: 20
        type: number
      ref:
        description: Optional Git ref to publish (for example an existing vX.Y.Z tag on manual recovery); defaults to the triggering ref.
        required: false
        default: ""
        type: string
      node_version:
        description: Node.js version when node_version_file is empty.
        required: false
        default: "22"
        type: string
      node_version_file:
        description: Version file such as .nvmrc or .node-version; pass an empty string to use node_version.
        required: false
        default: .nvmrc
        type: string
      package_manager:
        description: Dependency manager used for install, verify and build (npm, pnpm, yarn or bun). Publishing always uses the npm CLI.
        required: false
        default: npm
        type: string
      package_manager_version:
        description: Optional pinned package-manager version (pnpm or Bun).
        required: false
        default: ""
        type: string
      cache:
        description: setup-node cache provider; pass an empty string to disable.
        required: false
        default: npm
        type: string
      cache_dependency_path:
        description: Optional lockfile path or multiline list of lockfiles.
        required: false
        default: ""
        type: string
      install_command:
        description: Dependency install command, run at the repository root.
        required: false
        default: npm ci
        type: string
      verify_command:
        description: Optional pre-publish verification command, run at the repository root.
        required: false
        default: ""
        type: string
      build_command:
        description: Optional build command, run at the repository root before publishing.
        required: false
        default: ""
        type: string
      working_directory:
        description: Directory containing the package.json to publish (for example packages/cli).
        required: false
        default: "."
        type: string
      access:
        description: npm publish access level (public or restricted).
        required: false
        default: public
        type: string
      tag:
        description: npm dist-tag for the published version.
        required: false
        default: latest
        type: string
      provenance:
        description: Publish with npm provenance attestations; requires a public repository and the caller to grant id-token write.
        required: false
        default: true
        type: boolean
      dry_run:
        description: Run npm publish with --dry-run; nothing is uploaded.
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        description: Organization npm automation token with publish rights for the package.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enable Corepack
        if: inputs.package_manager == 'yarn'
        run: corepack enable

      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: ${{ inputs.package_manager_version || '' }}

      - name: Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ inputs.package_manager_version || 'latest' }}

      - name: Setup Node.js from version file
        if: inputs.node_version_file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}
          registry-url: https://registry.npmjs.org

      - name: Setup Node.js from explicit version
        if: inputs.node_version_file == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}
          registry-url: https://registry.npmjs.org

      - name: Validate inputs
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          ACCESS: ${{ inputs.access }}
          DIST_TAG: ${{ inputs.tag }}
          PACKAGE_DIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm|pnpm|yarn|bun) ;;
            *) echo "::error::Unsupported package manager: $PACKAGE_MANAGER"; exit 1 ;;
          esac
          case "$ACCESS" in
            public|restricted) ;;
            *) echo "::error::access must be public or restricted, got: $ACCESS"; exit 1 ;;
          esac
          if [[ ! "$DIST_TAG" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid npm dist-tag: $DIST_TAG"
            exit 1
          fi
          if [[ ! -f "$PACKAGE_DIR/package.json" ]]; then
            echo "::error::No package.json found in working_directory: $PACKAGE_DIR"
            exit 1
          fi

      - name: Install dependencies
        if: inputs.install_command != ''
        env:
          COMMAND: ${{ inputs.install_command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Verify
        if: inputs.verify_command != ''
        env:
          COMMAND: ${{ inputs.verify_command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Build
        if: inputs.build_command != ''
        env:
          COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Resolve package metadata
        id: package
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.private === true) throw new Error('package.json is marked private and cannot be published');
          if (!manifest.name || !manifest.version) throw new Error('package.json must declare name and version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${manifest.name}\nversion=${manifest.version}\n`);
          NODE

      - name: Check whether this version is already published
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already on npm; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ACCESS: ${{ inputs.access }}
          DIST_TAG: ${{ inputs.tag }}
          PROVENANCE: ${{ inputs.provenance }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          args=(publish --access "$ACCESS" --tag "$DIST_TAG")
          if [[ "$PROVENANCE" == "true" ]]; then args+=(--provenance); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm "${args[@]}"

      - name: Write publish summary
        if: always() && steps.package.outputs.name != ''
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.published }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DIST_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          {
            echo "### npm publish"
            echo ""
            echo "| Package | Version | Dist-tag | Dry run | Result |"
            echo "|---|---|---|---|---|"
            if [[ "$ALREADY_PUBLISHED" == "true" ]]; then result="skipped (already published)"; else result="${PUBLISH_OUTCOME:-not run}"; fi
            echo "| \`${PACKAGE_NAME}\` | ${PACKAGE_VERSION} | ${DIST_TAG} | ${DRY_RUN} | ${result} |"
          } >> "$GITHUB_STEP_SUMMARY"
