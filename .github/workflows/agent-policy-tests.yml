name: Agent Policy Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-policy-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint GitHub Actions workflows and managed templates
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -ignore 'unexpected key "queue" for "concurrency" section'
          .github/workflows/*.yml .github/templates/*.yml
      - name: Run all central Node regression tests
        run: node --test .github/scripts/*.test.mjs
      - name: Run organization showcase sync tests
        run: python -m unittest scripts/test_sync_org.py
